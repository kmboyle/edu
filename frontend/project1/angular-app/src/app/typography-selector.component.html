<div class="typography-selector">
  <mat-form-field appearance="outline">
    <mat-label>Select Typography</mat-label>
    <mat-select [value]="selectedTypography()" (selectionChange)="selectedTypography.set($event.value)">
      @for (typo of typographies; track typo.value) {
      <mat-option [value]="typo.value">{{ typo.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-button (click)="apply()">Apply</button>
</div>
