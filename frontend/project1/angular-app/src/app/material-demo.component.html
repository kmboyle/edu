<mat-toolbar color="primary">
  <span>{{ title }}</span>
</mat-toolbar>

<mat-card class="demo-card">
  <mat-card-title>Demo Components</mat-card-title>
  <mat-card-content>
    <app-typography-selector />
    <p>Here's a demonstration of some Angular Material components:</p>

    <div class="demo-container">
      <mat-slider [min]="0" [max]="100" aria-label="slider example">
        <input matSliderThumb [(ngModel)]="sliderValue" #slider>
      </mat-slider>
      <p>Slider value: {{ sliderValue }}</p>
    </div>

    <div class="demo-container">
      <mat-form-field appearance="fill">
        <mat-label>Enter your name</mat-label>
        <input matInput placeholder="Name">
      </mat-form-field>
      <p>Input value: {{ inputValue }}</p>
    </div>

    <div class="button-container">
      <button mat-raised-button color="primary">Primary Button</button>
      <button mat-raised-button color="accent">Accent Button</button>
      <button mat-raised-button color="warn">Warn Button</button>
      <button mat-stroked-button>Stroked Button</button>
      <button mat-flat-button>Flat Button</button>
    </div>
  </mat-card-content>
</mat-card>
